services:
  inventory-micro:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      MONGO_URL: ${MONGO_URL:?set MONGO_URL in commerce.env}
    restart: unless-stopped

  product-micro:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    ports:

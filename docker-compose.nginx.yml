services:
  nginx:
    image: nginx:alpine
    container_name: ecommerce_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      # These are container-local host entries: name -> EC2 private IP.
      - "gateway-a:${GATEWAY_A_PRIVATE_IP:?set GATEWAY_A_PRIVATE_IP}"
      - "gateway-b:${GATEWAY_B_PRIVATE_IP:?set GATEWAY_B_PRIVATE_IP}"
    restart: unless-stopped
services:
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_HOST_PORT:-5011}:5000"
    environment:
      GATEWAY_PORT: 5000
      GATEWAY_ID: ${GATEWAY_ID:?set GATEWAY_ID to gateway-a or gateway-b}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in gateway.env}
      ADMIN_SERVICE_URL: ${ADMIN_SERVICE_URL:?set ADMIN_SERVICE_URL in gateway.env}
      LOGIN_SERVICE_URL: ${LOGIN_SERVICE_URL:?set LOGIN_SERVICE_URL in gateway.env}
      USER_SERVICE_URL: ${USER_SERVICE_URL:?set USER_SERVICE_URL in gateway.env}
      REGISTRATION_SERVICE_URL: ${REGISTRATION_SERVICE_URL:?set REGISTRATION_SERVICE_URL in gateway.env}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:?set ORDER_SERVICE_URL in gateway.env}
      PRODUCT_SERVICE_URL: ${PRODUCT_SERVICE_URL:?set PRODUCT_SERVICE_URL in gateway.env}
      CATEGORY_SERVICE_URL: ${CATEGORY_SERVICE_URL:?set CATEGORY_SERVICE_URL in gateway.env}
      REVIEW_SERVICE_URL: ${REVIEW_SERVICE_URL:?set REVIEW_SERVICE_URL in gateway.env}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:?set PAYMENT_SERVICE_URL in gateway.env}
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:?set INVENTORY_SERVICE_URL in gateway.env}
    restart: unless-stopped
events {}

http {
    log_format gateway_load_balancing
        '$remote_addr "$request" status=$status '
        'upstream=$upstream_addr upstream_status=$upstream_status '
        'request_time=$request_time';

    access_log /var/log/nginx/access.log gateway_load_balancing;

    upstream api_gateway {
        # The two gateway containers are the two backend servers.
        server gateway-a:5000;
        server gateway-b:5000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            proxy_pass http://api_gateway;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;

            add_header X-Load-Balanced-By "nginx" always;
            add_header X-Gateway-Upstream $upstream_addr always;
        }
    }
}
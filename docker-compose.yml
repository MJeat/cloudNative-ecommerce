services:
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - GATEWAY_PORT=5000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the root .env file}
      - ADMIN_SERVICE_URL=http://admin-micro:5001
    depends_on:
      - admin-micro
    restart: on-failure

  admin-micro:
    container_name: admin_microservice
    build:
      context: .
      dockerfile: ./admin/Dockerfile
    expose:
      - "5001"
    environment:
      - PORT=5001
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure

  login-micro:
    container_name: login_microservice

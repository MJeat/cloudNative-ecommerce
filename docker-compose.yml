    environment:
      PORT: 5008
      MONGO_URL: ${COMMERCE_MONGO_URL:-${MONGO_URL:?set MONGO_URL or COMMERCE_MONGO_URL in .env}}
    restart: unless-stopped

  b-order-micro:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    expose:
      - "5009"
    environment:
      PORT: 5009
      MONGO_URL: ${COMMERCE_MONGO_URL:-${MONGO_URL:?set MONGO_URL or COMMERCE_MONGO_URL in .env}}
    restart: unless-stopped

  b-payment-micro:

services:
  api-gateway:
    container_name: api-gateway
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    ports:
      - "5011:5000"
    environment:
      - GATEWAY_PORT=5000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the root .env file}
      - ADMIN_SERVICE_URL=http://admin-micro:5001
      - LOGIN_SERVICE_URL=http://login-micro:5004
      - USER_SERVICE_URL=http://user-micro:5002
      - REGISTRATION_SERVICE_URL=http://reg-micro:5003
      - ORDER_SERVICE_URL=http://order-micro:5009
      - PRODUCT_SERVICE_URL=http://product-micro:5006
      - CATEGORY_SERVICE_URL=http://category-micro:5007
      - REVIEW_SERVICE_URL=http://review-micro:5008
      - PAYMENT_SERVICE_URL=http://payment-micro:5010
      - INVENTORY_SERVICE_URL=http://inventory-micro:5005
    depends_on:
      - admin-micro
      - login-micro
      - user-micro
      - reg-micro
      - order-micro
      - product-micro
      - category-micro
      - review-micro
      - payment-micro
      - inventory-micro
    restart: on-failure

  admin-micro:
    container_name: admin_microservice
    build:
      context: .
      dockerfile: ./admin/Dockerfile
    expose:
      - "5001"
    environment:
      - PORT=5001
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure

  login-micro:
    container_name: login_microservice
    build:
      context: .
      dockerfile: ./login/Dockerfile
    expose:
      - "5004"
    environment:
      - PORT=5004
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in the root .env file}
    restart: on-failure

  user-micro:
    container_name: user_microservice
    build:
      context: .
      dockerfile: ./user/Dockerfile
    expose:
      - "5002"
    environment:
      - PORT=5002
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure

  reg-micro:
    container_name: reg_microservice
    build:
      context: .
      dockerfile: ./registration/Dockerfile
    expose:
      - "5003"
    environment:
      - PORT=5003
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure



  order-micro:
    container_name: order_microservice
    build:
      context: ./order-service
      dockerfile: Dockerfile
    expose:
      - "5009"
    environment:
      - PORT=5009
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure

  product-micro:
    container_name: product_microservice
    build:
      context: ./product-service
      dockerfile: Dockerfile
    expose:
      - "5006"
    environment:
      - PORT=5006
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure

  category-micro:
    container_name: category_microservice
    build:
      context: ./category-service
      dockerfile: Dockerfile
    expose:
      - "5007"
    environment:
      - PORT=5007
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure

  review-micro:
    container_name: review_microservice
    build:
      context: ./review-service
      dockerfile: Dockerfile
    expose:
      - "5008"
    environment:
      - PORT=5008
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure

  payment-micro:
    container_name: payment_microservice
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    expose:
      - "5010"
    environment:
      - PORT=5010
      - MONGO_URL=${MONGO_URL:?MONGO_URL must be set in the root .env file}
    restart: on-failure

  inventory-micro:
    container_name: inventory_microservice
    build:
      context: ./inventory-service
